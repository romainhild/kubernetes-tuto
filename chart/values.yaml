web:
  replicaCount: 3 # valeur de départ -- ignorée une fois web.autoscaling.enabled=true
  image:
    repository: local/k8s-tutorial-counter
    tag: dev
    pullPolicy: Never
  welcomeMessage: "Bonjour depuis Helm !"
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 50

postgres:
  replicaCount: 1
  image:
    repository: postgres
    tag: "16-alpine"
  storage: 1Gi
  db:
    name: tutorial
    user: tutorial_user
    # À ne JAMAIS committer en vrai : cf STEP.md (section "Secrets et Helm").
    password: demo-db-password-change-me
  apiToken: demo-secret-token-12345

ingress:
  enabled: true
  className: nginx
  host: tuto.local
  tls:
    enabled: false
    secretName: tuto-tls

rbac:
  create: true
