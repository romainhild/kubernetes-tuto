# Variante NodePort : en plus du ClusterIP, ouvre le même port (ici 30080)
# sur TOUS les nœuds du cluster. Avec minikube, "minikube service web-nodeport"
# ouvre directement cette URL dans le navigateur.
# À essayer en plus du ClusterIP (noms différents, pas de conflit) :
#   kubectl apply -f k8s/service-nodeport.yaml
apiVersion: v1
kind: Service
metadata:
  name: web-nodeport
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
