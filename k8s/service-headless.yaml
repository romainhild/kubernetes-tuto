# Variante "headless" : clusterIP: None. Pas d'IP virtuelle ni de
# load-balancing côté Service — une requête DNS sur "web-headless" renvoie
# directement la liste des IP de TOUS les Pods correspondants au selector.
# Utile quand le client doit choisir lui-même à quel Pod parler (ex: bases
# de données en cluster, protocoles avec état côté client). On la retrouvera
# naturellement avec les StatefulSets (mentionnés à l'étape 8).
apiVersion: v1
kind: Service
metadata:
  name: web-headless
  namespace: tutorial-app
spec:
  clusterIP: None
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
