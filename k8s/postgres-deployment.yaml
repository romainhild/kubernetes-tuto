apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: tutorial-app
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    # Recreate (pas RollingUpdate) : le volume est ReadWriteOnce, un seul
    # Pod peut le monter à la fois. Un rolling update essaierait de démarrer
    # le nouveau Pod avant de tuer l'ancien -> il resterait bloqué en attente
    # du volume. Recreate tue l'ancien Pod avant de créer le nouveau.
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: db-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: db-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
