# Même Ingress que k8s/ingress.yaml, avec une section "tls" en plus.
# Suppose qu'un Secret kubernetes.io/tls nommé "tuto-tls" existe déjà
# dans le namespace (voir STEP.md pour le générer et le créer).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: tutorial-app
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tuto.local
      secretName: tuto-tls
  rules:
    - host: tuto.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
