# Service "gouvernant" du StatefulSet : clusterIP: None (headless), c'est
# ce que référence "serviceName" dans le StatefulSet. Il ne fait plus de
# répartition de charge : il donne surtout à chaque Pod un nom DNS stable
# (ex: postgres-0.postgres.tutorial-app.svc.cluster.local).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: tutorial-app
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
