# Variante ExternalName : pas de selector, pas de Pods derrière. C'est un
# simple alias DNS interne au cluster vers un nom externe. Utile pour que
# tes Pods appellent "api-externe" sans coder en dur le vrai nom de domaine
# (facilite les migrations / changements de fournisseur plus tard).
# Donné ici à titre d'exemple — pas nécessaire pour notre appli, pas besoin
# de l'appliquer.
apiVersion: v1
kind: Service
metadata:
  name: api-externe
spec:
  type: ExternalName
  externalName: exemple-de-fournisseur.com
