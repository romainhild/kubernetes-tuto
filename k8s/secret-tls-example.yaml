# Exemple de référence (non appliqué) : un Secret de type "kubernetes.io/tls",
# le format attendu par un Ingress pour servir du HTTPS. Les champs "data"
# contiendraient en vrai un certificat et une clé privée encodés en base64 ;
# ici juste la forme, pas de vraies valeurs.
apiVersion: v1
kind: Secret
metadata:
  name: exemple-tls
type: kubernetes.io/tls
data:
  tls.crt: <base64 du certificat>
  tls.key: <base64 de la clé privée>
